name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Format, lint, and unit specs
        run: |
          docker run --rm -v "$PWD:/app" -w /app \
            -e CRYSTAL_CACHE_DIR=/tmp/crystal-cache crystallang/crystal:1.21.0 \
            bash -ec 'shards install
          crystal tool format --check --exclude lib --exclude examples/kemal_api/lib
          shards build ameba
          bin/ameba
          crystal spec --error-on-warnings --error-trace'

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache shards
        uses: actions/cache@v5
        with:
          path: |
            lib
            .shards
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.yml') }}
          restore-keys: |
            ${{ runner.os }}-shards-

      - name: Cache kcov build
        id: kcov-cache
        uses: actions/cache@v5
        with:
          path: .cache/kcov
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-kcov-v43

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      - name: Install shards
        run: shards install

      - name: Install kcov dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-dev build-essential cmake python3 libssl-dev libcurl4-openssl-dev \
            libelf-dev zlib1g-dev libdw-dev libiberty-dev

      - name: Build kcov
        if: steps.kcov-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v43 \
            https://github.com/SimonKagstrom/kcov.git "$RUNNER_TEMP/kcov"
          cmake -S "$RUNNER_TEMP/kcov" -B "$RUNNER_TEMP/kcov-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/.cache/kcov"
          cmake --build "$RUNNER_TEMP/kcov-build" --parallel 2
          cmake --install "$RUNNER_TEMP/kcov-build"

      - name: Add kcov to PATH
        run: echo "$PWD/.cache/kcov/bin" >> "$GITHUB_PATH"

      - name: Build and run coverage
        run: make coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        server: [lts, stable]
        compression: [none, lz4]
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable TLS certificates
        run: bash scripts/generate-test-certs.sh
      - name: Start pinned native TCP and TLS servers
        run: docker compose up -d --wait
      - name: Independently validate revision 54460
        if: matrix.compression == 'none'
        env:
          SERVER: ${{ matrix.server }}
        run: |
          if [ "$SERVER" = lts ]; then
            tcp_port=19000
            tls_port=19440
          else
            tcp_port=29000
            tls_port=29440
          fi
          python3 scripts/native-protocol-probe.py --port "$tcp_port"
          python3 scripts/native-protocol-probe.py --port "$tls_port" \
            --tls --ca spec/fixtures/tls/ca.crt --tls-hostname localhost
      - name: Run Crystal integration specs
        env:
          CLICKHOUSE_COMPRESSION: ${{ matrix.compression }}
        run: bash scripts/test-integration.sh '${{ matrix.server }}'
      - name: Server diagnostics
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop disposable servers
        if: always()
        run: docker compose down -v

  kemal-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start the example's disposable ClickHouse server
        run: docker compose -f examples/kemal_api/docker-compose.yml up -d --wait
      - name: Build and test the standalone API against this checkout
        run: |
          docker run --rm --network clickhouse-kemal-ortb_default \
            -v "$PWD:/app" -w /app/examples/kemal_api \
            -e CRYSTAL_CACHE_DIR=/tmp/crystal-cache \
            -e SHARDS_OVERRIDE=/tmp/clickhouse-ci.override.yml \
            -e CLICKHOUSE_URL=clickhouse://default:clickhouse_test@clickhouse:9000/default \
            crystallang/crystal:1.21.0 bash -ec 'printf "dependencies:\n  clickhouse:\n    path: /app\n" > "$SHARDS_OVERRIDE"
          shards install
          crystal spec --error-on-warnings --error-trace
          CLICKHOUSE_INTEGRATION=1 crystal spec --error-on-warnings --error-trace
          crystal build src/main.cr --error-on-warnings -o /tmp/kemal_api'
      - name: Server diagnostics
        if: failure()
        run: docker compose -f examples/kemal_api/docker-compose.yml logs --tail 100
      - name: Stop the example's disposable server
        if: always()
        run: docker compose -f examples/kemal_api/docker-compose.yml down -v
