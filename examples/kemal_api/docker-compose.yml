name: clickhouse-kemal-ortb

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.31.2@sha256:05d2e46507afdcf08da46e5528b68847104dbbed691c327e505414b4b7f4e4c8
    container_name: clickhouse-kemal-ortb-server
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse_test
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:19001:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "clickhouse_test", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 10s
    mem_limit: 2g
